<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reemplazador Pro</title>
  <link rel="icon" type="image/x-icon" sizes="32x32" href="favicon.svg">
  <link rel="icon" type="image/x-icon" sizes="256x256" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: #ecfdf5;
      color: #062c22;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header { text-align: center; padding: 20px 0; color: #064e3b; }
    header h1 { font-size: 24px; font-weight: 800; }
    header p { font-size: 13px; color: #047857; margin-top: 4px; }

    #reemplazadorPro { max-width: 1100px; margin: auto; }

    textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #a7f3d0;
      resize: vertical;
      margin-bottom: 15px;
      box-sizing: border-box;
      outline: none;
    }

    textarea:focus, input:focus { border-color: #10b981; }

    .panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #a7f3d0;
      box-sizing: border-box;
      outline: none;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px 0;
      font-size: 15px;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }

    .primary { background: #0d6efd; color: white; }
    .success { background: #198754; color: white; width: 100%; }
    .warning { background: #ffc107; color: #333; }
    .danger { background: #dc3545; color: white; }
    .info { background: #0dcaf0; color: #000; }

    .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }

    .stats {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer { text-align: center; padding: 20px 0; font-size: 13px; color: #047857; margin-top: auto; }

    @media(max-width:800px){
      .panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🔄 Reemplazador de Texto PRO</h1>
    <p>Procesamiento rápido y masivo de cadenas de texto</p>
  </header>

  <textarea id="texto" placeholder="Pega aquí el texto..."></textarea>

  <div class="panel">
    <div>
      <h3 style="margin-bottom: 10px;">Reemplazo Simple</h3>
      <input id="buscar" placeholder="Buscar">
      <br><br>
      <input id="reemplazar" placeholder="Reemplazar por">
      <br><br>
      <label><input type="checkbox" id="case"> Sensible a mayúsculas</label><br>
      <label><input type="checkbox" id="regex"> Usar Regex</label>
      <br><br>
      <button class="primary" style="width:100%" onclick="reemplazarSimple()">Reemplazar</button>
    </div>

    <div>
      <h3 style="margin-bottom: 10px;">Reemplazo Masivo</h3>
      <p style="font-size: 12px; margin-bottom: 5px;">Formato: <code>buscar=reemplazo</code></p>
      <textarea id="masivo" style="height:120px;" placeholder="hola=adiós&#10;rojo=azul"></textarea>
      <button class="success" onclick="reemplazoMasivo()">Reemplazo Masivo</button>
    </div>
  </div>

  <div class="action-buttons">
    <button class="info" onclick="copiar()">Copiar Resultado</button>
    <button class="warning" onclick="descargar()">Descargar TXT</button>
    <button class="danger" onclick="limpiar()">Limpiar</button>
  </div>

  <div class="stats">
    <span id="contador">Reemplazos: 0</span>
  </div>

  <footer>
    Desarrollado con 💚 por <strong>Thaurock</strong>
  </footer>

  <script>
    function escapeRegex(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function reemplazarSimple() {
      let texto = document.getElementById("texto").value;
      let buscar = document.getElementById("buscar").value;
      let reemplazar = document.getElementById("reemplazar").value;
      let regex = document.getElementById("regex").checked;
      let cs = document.getElementById("case").checked;

      if (buscar === "") return;

      let flags = "g";
      if (!cs) flags += "i";

      let exp;
      try {
        if (regex) {
          exp = new RegExp(buscar, flags);
        } else {
          exp = new RegExp(escapeRegex(buscar), flags);
        }
      } catch (e) {
        alert("Expresión regular inválida");
        return;
      }

      let coincidencias = (texto.match(exp) || []).length;
      texto = texto.replace(exp, reemplazar);

      document.getElementById("texto").value = texto;
      document.getElementById("contador").innerText = "Reemplazos: " + coincidencias;
    }

    function reemplazoMasivo() {
      let texto = document.getElementById("texto").value;
      let reglas = document.getElementById("masivo").value.trim().split("\n");
      let total = 0;

      reglas.forEach(r => {
        if (r.includes("=")) {
          let partes = r.split("=");
          let b = escapeRegex(partes[0].trim());
          let c = partes.slice(1).join("=").trim();
          if (b !== "") {
            let exp = new RegExp(b, "gi");
            let n = (texto.match(exp) || []).length;
            total += n;
            texto = texto.replace(exp, c);
          }
        }
      });

      document.getElementById("texto").value = texto;
      document.getElementById("contador").innerText = "Reemplazos: " + total;
    }

    // Copiado universal compatible con HTTP/HTTPS y móviles
    function copiar() {
      let areaTexto = document.getElementById("texto");
      if (!areaTexto.value) {
        alert("No hay texto para copiar.");
        return;
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(areaTexto.value).then(() => {
          alert("Texto copiado al portapapeles.");
        }).catch(() => {
          copiadoFallback(areaTexto);
        });
      } else {
        copiadoFallback(areaTexto);
      }
    }

    function copiadoFallback(areaTexto) {
      areaTexto.select();
      areaTexto.setSelectionRange(0, 99999);
      document.execCommand("copy");
      alert("Texto copiado al portapapeles.");
    }

    // Descarga corregida con enlace temporal en el DOM
    function descargar() {
      let texto = document.getElementById("texto").value;
      if (!texto) {
        alert("El campo de texto está vacío.");
        return;
      }

      let blob = new Blob([texto], { type: "text/plain;charset=utf-8" });
      let url = URL.createObjectURL(blob);
      let a = document.createElement("a");
      a.href = url;
      a.download = "texto_procesado.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function limpiar() {
      document.getElementById("texto").value = "";
      document.getElementById("buscar").value = "";
      document.getElementById("reemplazar").value = "";
      document.getElementById("masivo").value = "";
      document.getElementById("contador").innerText = "Reemplazos: 0";
    }
  </script>
</body>
</html>
